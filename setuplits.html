<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up List アーカイブ | #mp8090 × ナウヤン同盟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Set Up List 専用スタイル ── */
    .sul-nav {
      background: var(--bg-nav);
      border-bottom: 2px solid #3A1C00;
      padding: 0.75rem 1rem;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45);
    }
    .sul-nav-inner {
      max-width: 860px;
      margin: 0 auto;
    }
    .sul-nav .nav-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--accent-mg);
      letter-spacing: 0.28em;
      margin-bottom: 0.5rem;
      opacity: 0.75;
    }
    .sul-nav .year-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .sul-year-btn {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right:  2px solid #0E0400;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.28rem 0.5rem;
      min-width: 3.6rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, box-shadow 0.12s, transform 0.08s;
      user-select: none;
      text-align: center;
      text-decoration: none;
    }
    .sul-year-btn:hover {
      background: var(--bg-nav-btn-h);
      color: var(--gold-l);
      border-color: var(--gold-d);
      border-bottom-color: #0E0400;
    }

    /* ── Main content ── */
    .sul-main {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ── Year section ── */
    .sul-year-section {
      margin-bottom: 2.5rem;
      background: #fff;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--border-table);
      animation: fadeIn 0.3s ease;
    }

    .sul-year-header {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .sul-year-title {
      color: #fff;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    }
    .sul-year-count {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.9);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Episode rows ── */
    .sul-list {
      list-style: none;
    }
    .sul-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1.1rem;
      border-bottom: 1px solid var(--border-table);
      transition: background 0.12s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .sul-item:last-child {
      border-bottom: none;
    }
    .sul-item:nth-child(odd)  { background: var(--stripe-odd); }
    .sul-item:nth-child(even) { background: var(--stripe-even); }

    .sul-item.has-image:hover,
    .sul-item.has-tracks:hover {
      background: #FFEEC0;
    }
    .sul-item.no-data {
      cursor: default;
      opacity: 0.62;
    }
    .sul-track-btn {
      background: var(--accent-cyan);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      padding: 0.22rem 0.5rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s;
      line-height: 1;
    }
    .sul-track-btn:hover { background: var(--accent-cyan-l); }

    .sul-ep-no {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--accent-mg);
      font-weight: 700;
      min-width: 3.8rem;
      white-space: nowrap;
    }
    .sul-date {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      color: var(--text-muted);
      min-width: 6.5rem;
      white-space: nowrap;
    }
    .sul-feature {
      font-size: 0.9rem;
      color: var(--text-dark);
      flex: 1;
      min-width: 0;
    }
    .sul-badge-pending {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: #E0D0B8;
      color: #9A7850;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sul-img-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ── Loading / Error ── */
    .sul-loading {
      text-align: center;
      color: var(--text-mid);
      font-style: italic;
      padding: 4rem 1rem;
      font-size: 1.1rem;
    }
    .sul-loading .loading-icon {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      animation: float 1.8s ease-in-out infinite;
    }
    .sul-error {
      background: #FFF0F0;
      color: #C00;
      border: 1px solid #FCC;
      border-radius: var(--r-md);
      padding: 1.2rem 1.5rem;
      text-align: center;
    }

    /* ── Back link in header ── */
    .header-back-link {
      display: inline-block;
      color: var(--accent-cyan-xl);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      text-decoration: none;
      letter-spacing: 0.06em;
      margin-bottom: 0.9rem;
      opacity: 0.85;
      transition: opacity 0.12s;
    }
    .header-back-link:hover { opacity: 1; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .sul-item {
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .sul-date {
        min-width: auto;
      }
    }
    @media (max-width: 420px) {
      .sul-ep-no { font-size: 0.78rem; min-width: 3.2rem; }
      .sul-date  { font-size: 0.7rem; }
      .sul-feature { font-size: 0.82rem; }
    }

    /* ── Episode modal ── */
    .ep-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.62);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }
    .ep-modal-overlay[hidden] { display: none; }

    .ep-modal {
      background: var(--bg-primary);
      border-radius: var(--r-lg);
      box-shadow: 0 8px 40px rgba(0,0,0,0.55);
      width: 100%;
      max-width: 620px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 3rem);
    }
    .ep-modal-hdr {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      padding: 0.9rem 3.2rem 0.9rem 1.25rem;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      flex-shrink: 0;
      position: relative;
    }
    .ep-modal-title {
      color: #fff;
      font-family: var(--font-mono);
      font-size: clamp(0.72rem, 2.5vw, 0.92rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      display: block;
    }
    .ep-modal-close {
      position: absolute;
      top: 0.55rem;
      right: 0.6rem;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      border-radius: 50%;
      width: 2.4rem;
      height: 2.4rem;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      flex-shrink: 0;
    }
    .ep-modal-close:hover { background: rgba(255,255,255,0.32); }
    .ep-modal-body {
      padding: 1.1rem 1.25rem 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    /* Modal inner tabs */
    .ep-modal-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .ep-modal-tab {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right: 2px solid #0E0400;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      padding: 0.38rem 1rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .ep-modal-tab:hover { background: var(--bg-nav-btn-h); color: var(--gold-l); }
    .ep-modal-tab.active {
      background: var(--accent-mg);
      color: #fff;
      border-color: #7A0050;
      border-bottom-color: #3A0020;
      border-right-color: #3A0020;
    }

    /* Track table */
    .ep-track-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ep-track-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 320px;
    }
    .ep-track-table th {
      background: var(--bg-secondary);
      color: var(--text-mid);
      font-weight: 700;
      padding: 0.42rem 0.55rem;
      text-align: left;
      border-bottom: 2px solid var(--border-head);
      white-space: nowrap;
    }
    .ep-track-table td {
      padding: 0.38rem 0.55rem;
      border-bottom: 1px solid var(--border-table);
      vertical-align: middle;
    }
    .ep-track-table tr:nth-child(odd)  td { background: var(--stripe-odd); }
    .ep-track-table tr:nth-child(even) td { background: var(--stripe-even); }
    .ep-track-table .col-no {
      width: 2rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
    }
    .ep-track-table .col-note { white-space: nowrap; }

    /* Note badges */
    .note-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.12rem 0.48rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .note-badge.tokushu { background: var(--accent-mg);   color: #fff; }
    .note-badge.yougaku { background: var(--accent-cyan);  color: #fff; }
    .note-badge.other   { background: #E0D0B8; color: #7A5830; }

    /* Modal image */
    .ep-modal-img {
      width: 100%;
      border-radius: var(--r-md);
      display: block;
    }

    /* No data message */
    .ep-modal-nodata {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 1rem;
      font-style: italic;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .ep-modal-overlay { padding: 0.5rem; }
      .ep-modal { max-height: calc(100vh - 1rem); border-radius: var(--r-md); }
      .ep-modal-hdr { padding: 0.8rem 3rem 0.8rem 1rem; }
      .ep-modal-body { padding: 0.9rem 1rem 1rem; }
    }

    /* ── Tab bar ── */
    .sul-tab-bar {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .sul-tab-btn {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right: 2px solid #0E0400;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      letter-spacing: 0.03em;
      padding: 0.35rem 0.95rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .sul-tab-btn:hover {
      background: var(--bg-nav-btn-h);
      color: var(--gold-l);
    }
    .sul-tab-btn.active {
      background: var(--accent-mg);
      color: #fff;
      border-color: #7A0050;
      border-bottom-color: #3A0020;
      border-right-color: #3A0020;
    }

    /* ── Calendar year nav ── */
    .cal-year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin: 1.5rem 0 1rem;
    }
    .cal-year-nav-btn {
      background: var(--accent-mg);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      width: 2.4rem;
      height: 2.4rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.12s, opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cal-year-nav-btn:hover:not(:disabled) { background: #5A0040; }
    .cal-year-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .cal-year-display {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-mg);
      letter-spacing: 0.05em;
      min-width: 6rem;
      text-align: center;
    }

    /* ── Calendar grid ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    @media (max-width: 600px) {
      .cal-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Month cell ── */
    .cal-month {
      background: #fff;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-table);
      overflow: hidden;
    }
    .cal-month-hdr {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      color: #fff;
      text-align: center;
      padding: 0.4rem 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .cal-month-body {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 3.2rem;
    }
    .cal-empty {
      color: var(--text-muted);
      text-align: center;
      font-size: 1rem;
      padding: 0.5rem 0;
      align-self: center;
    }

    /* ── Episode badge ── */
    .cal-badge {
      display: block;
      width: 100%;
      min-height: 44px;
      background: #006D77;
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      padding: 0.5rem 0.7rem;
      font-size: 0.72rem;
      font-family: var(--font-sans);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s;
      word-break: break-all;
    }
    .cal-badge:hover { background: #005a63; }
    .cal-badge.no-data {
      background: #A8A090;
      color: #F0EAE0;
    }
    .cal-badge.minimal {
      background: #EDEAE4;
      color: #AEA89E;
      border: 1px dashed #C8C0B4;
      cursor: default;
      font-weight: 400;
    }
    .cal-badge.minimal:hover { background: #EDEAE4; }
    .cal-badge-l1 { display: block; font-weight: 600; }
    .cal-badge-l2 { display: block; font-size: 0.68rem; opacity: 0.88; margin-top: 0.1rem; }
    .cal-track-btn {
      display: block;
      width: 100%;
      background: rgba(0,109,119,0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--r-sm);
      padding: 0.2rem 0.5rem;
      font-size: 0.65rem;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
      text-align: center;
      margin-top: 0.2rem;
    }
    .cal-track-btn:hover { background: rgba(0,109,119,0.28); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-deco" aria-hidden="true"></div>
    <div class="header-inner">
      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:0.9rem;">
        <a href="top.html" class="header-back-link" style="margin-bottom:0;">← ナウヤン同盟の部屋へ</a>
        <a href="index.html" class="header-back-link" style="margin-bottom:0;">← ランキングページへ</a>
      </div>
      <p class="header-badge">mp8090のオンエア曲がここに集結</p>
      <h1 class="site-title"><span class="title-note" aria-hidden="true">🎵</span> mp8090 Set Up List アーカイブ</h1>
      <p class="site-subtitle">LuckyFM「Music Pick Up 80's &amp; 90's」の非公式ファンサイトです</p>
    </div>
  </header>

  <nav class="sul-nav" aria-label="ナビゲーション">
    <div class="sul-nav-inner">
      <div class="sul-tab-bar" role="tablist">
        <button class="sul-tab-btn active" data-tab="list" role="tab" aria-selected="true">📋 リスト表示</button>
        <button class="sul-tab-btn" data-tab="calendar" role="tab" aria-selected="false">📅 カレンダー表示</button>
      </div>
      <div id="listNav">
        <span class="nav-label" aria-hidden="true">◀ YEAR SELECT ▶</span>
        <div class="year-buttons" id="yearButtons" role="group" aria-label="年別ボタン"></div>
      </div>
    </div>
  </nav>

  <main class="sul-main" id="main">
    <div id="loadingMsg" class="sul-loading" aria-live="polite">
      <span class="loading-icon" aria-hidden="true">🎶</span>
      データを読み込み中…
    </div>
    <div id="listArea" hidden></div>
    <div id="calArea" hidden></div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-credit">
        <a href="index.html">← 年間シングルヒット曲ランキングへ</a>
      </p>
      <p class="footer-disclaimer">※本サイトは非公式のファンサイトです</p>
    </div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="ページ先頭へ戻る">↑ TOP</button>

  <!-- ── Episode detail modal ── -->
  <div id="epModalOverlay" class="ep-modal-overlay" hidden
       role="dialog" aria-modal="true" aria-labelledby="epModalTitle">
    <div class="ep-modal">
      <div class="ep-modal-hdr">
        <span class="ep-modal-title" id="epModalTitle"></span>
        <button class="ep-modal-close" id="epModalClose" aria-label="閉じる">✕</button>
      </div>
      <div class="ep-modal-body" id="epModalBody"></div>
    </div>
  </div>

    const listNav     = document.getElementById('listNav');
    const backToTop   = document.getElementById('backToTop');

    // ── group by puy_year for list view ──
    const byYear = new Map();
    for (const ep of episodes) {
      const y = ep.puy_year ?? '不明';
      if (!byYear.has(y)) byYear.set(y, []);
      byYear.get(y).push(ep);
    }
    for (const eps of byYear.values()) {
      eps.sort((a, b) => a.episode_no - b.episode_no);
    }
    const years = [...byYear.keys()].sort((a, b) => a - b);

    // ── year nav buttons (list mode) ──
    for (const y of years) {
      const btn = document.createElement('a');
      btn.href = `#year-${y}`;
      btn.className = 'sul-year-btn';
      btn.textContent = String(y);
      btn.addEventListener('click', e => {
        e.preventDefault();
        const section = document.getElementById(`year-${y}`);
        if (!section) return;
        const navHeight = document.querySelector('.sul-nav')?.offsetHeight ?? 0;
        const top = section.getBoundingClientRect().top + window.scrollY - navHeight;
        window.scrollTo({ top, behavior: 'smooth' });
      });
      yearButtons.appendChild(btn);
    }

    // ── render list sections ──
    const frag = document.createDocumentFragment();

    for (const y of years) {
      const eps = byYear.get(y);
      const section = document.createElement('section');
      section.id = `year-${y}`;
      section.className = 'sul-year-section';

      const hdr = document.createElement('div');
      hdr.className = 'sul-year-header';

      const title = document.createElement('h2');
      title.className = 'sul-year-title';
      title.textContent = `▼ ${y}年`;

      const count = document.createElement('span');
      count.className = 'sul-year-count';
      count.textContent = `${eps.length}回`;

      hdr.appendChild(title);
      hdr.appendChild(count);
      section.appendChild(hdr);

      const ul = document.createElement('ul');
      ul.className = 'sul-list';

      for (const ep of eps) {
        const hasTracks = ep.tracks && ep.tracks.length > 0;
        const hasImage  = !!ep.image_file;

        const li = document.createElement('li');
        if (hasImage) {
          li.className = 'sul-item has-image';
          li.setAttribute('role', 'button');
          li.setAttribute('tabindex', '0');
          li.title = '画像を新しいタブで開く';
          const openImg = () => window.open(`images/setuplits/${ep.image_file}`, '_blank');
          li.addEventListener('click', openImg);
          li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openImg(); } });
        } else if (hasTracks) {
          li.className = 'sul-item has-tracks';
          li.setAttribute('role', 'button');
          li.setAttribute('tabindex', '0');
          li.title = '曲目一覧を表示';
          const openTracks = () => openModal(ep);
          li.addEventListener('click', openTracks);
          li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTracks(); } });
        } else {
          li.className = 'sul-item no-data';
        }

        const epNo = document.createElement('span');
        epNo.className = 'sul-ep-no';
        epNo.textContent = `#${ep.episode_no}`;

        const date = document.createElement('span');
        date.className = 'sul-date';
        date.textContent = ep.air_date ? ep.air_date.replace(/-/g, '.') : '—';

        const feature = document.createElement('span');
        feature.className = 'sul-feature';
        feature.textContent = ep.special_feature || '—';

        li.appendChild(epNo);
        li.appendChild(date);
        li.appendChild(feature);

        if (hasImage) {
          const icon = document.createElement('span');
          icon.className = 'sul-img-icon';
          icon.setAttribute('aria-hidden', 'true');
          icon.textContent = '🖼';
          li.appendChild(icon);
          if (hasTracks) {
            const trackBtn = document.createElement('button');
            trackBtn.className = 'sul-track-btn';
            trackBtn.textContent = '📋';
            trackBtn.title = '曲目一覧を表示';
            trackBtn.setAttribute('aria-label', '曲目一覧を表示');
            trackBtn.addEventListener('click', e => { e.stopPropagation(); openModal(ep); });
            li.appendChild(trackBtn);
          }
        } else if (hasTracks) {
          const badge = document.createElement('span');
          badge.className = 'sul-badge-pending';
          badge.style.cssText = 'background:#006D77;color:#fff;';
          badge.textContent = '📋 曲目あり';
          li.appendChild(badge);
        } else {
          const badge = document.createElement('span');
          badge.className = 'sul-badge-pending';
          badge.textContent = 'データ準備中';
          li.appendChild(badge);
        }

        ul.appendChild(li);
      }

      section.appendChild(ul);
      frag.appendChild(section);
    }

    listArea.appendChild(frag);
    loadingMsg.hidden = true;
    listArea.hidden   = false;

    // ── Calendar: group by air_date year ──
    const calEps = episodes.filter(ep => ep.air_date);
    const calByYear = new Map();
    for (const ep of calEps) {
      const y = parseInt(ep.air_date.slice(0, 4), 10);
      if (!calByYear.has(y)) calByYear.set(y, []);
      calByYear.get(y).push(ep);
    }
    const calDataYears = new Set(calEps.map(ep => parseInt(ep.air_date.slice(0, 4), 10)));
    calDataYears.add(2020); // 開始年を2020年に固定
    const calYears = [...calDataYears].sort((a, b) => a - b);
    const latestAirYear = calEps.reduce((max, ep) => Math.max(max, parseInt(ep.air_date.slice(0, 4), 10)), 2020);
    let calCurYear = latestAirYear;

    function renderCalendar() {
      calArea.innerHTML = '';

      // year navigation
      const nav = document.createElement('div');
      nav.className = 'cal-year-nav';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'cal-year-nav-btn';
      prevBtn.textContent = '◀';
      prevBtn.disabled = calCurYear <= calYears[0];
      prevBtn.setAttribute('aria-label', '前の年');
      prevBtn.addEventListener('click', () => {
        const idx = calYears.indexOf(calCurYear);
        if (idx > 0) { calCurYear = calYears[idx - 1]; renderCalendar(); }
      });

      const yearDisp = document.createElement('span');
      yearDisp.className = 'cal-year-display';
      yearDisp.textContent = `${calCurYear}年`;

      const nextBtn = document.createElement('button');
      nextBtn.className = 'cal-year-nav-btn';
      nextBtn.textContent = '▶';
      nextBtn.disabled = calCurYear >= calYears[calYears.length - 1];
      nextBtn.setAttribute('aria-label', '次の年');
      nextBtn.addEventListener('click', () => {
        const idx = calYears.indexOf(calCurYear);
        if (idx < calYears.length - 1) { calCurYear = calYears[idx + 1]; renderCalendar(); }
      });

      nav.appendChild(prevBtn);
      nav.appendChild(yearDisp);
      nav.appendChild(nextBtn);
      calArea.appendChild(nav);

      // 12-month grid
      const grid = document.createElement('div');
      grid.className = 'cal-grid';

      const yearEps = calByYear.get(calCurYear) || [];
      const byMonth = new Map();
      for (const ep of yearEps) {
        const m = parseInt(ep.air_date.slice(5, 7), 10);
        if (!byMonth.has(m)) byMonth.set(m, []);
        byMonth.get(m).push(ep);
      }
      for (const eps of byMonth.values()) {
        eps.sort((a, b) => a.episode_no - b.episode_no);
      }

      const startMonth = calCurYear === 2020 ? 9 : 1;
      for (let m = startMonth; m <= 12; m++) {
        const cell = document.createElement('div');
        cell.className = 'cal-month';

        const mhdr = document.createElement('div');
        mhdr.className = 'cal-month-hdr';
        mhdr.textContent = `${m}月`;
        cell.appendChild(mhdr);

        const body = document.createElement('div');
        body.className = 'cal-month-body';

        const eps = byMonth.get(m) || [];
        if (eps.length === 0) {
          const empty = document.createElement('span');
          empty.className = 'cal-empty';
          empty.textContent = 'ー';
          body.appendChild(empty);
        } else {
          for (const ep of eps) {
            const hasTracks = ep.tracks && ep.tracks.length > 0;
            const hasImage  = !!ep.image_file;
            const [y, mo, d] = ep.air_date.split('-').map(Number);
            const airFmt = `${y}.${mo}.${d}`;

            const badge = document.createElement('button');

            // ep27以上かつspecial_feature null かつ tracks なし → 控えめ表示のみ、クリック不可
            if (ep.episode_no >= 27 && !ep.special_feature && (!ep.tracks || ep.tracks.length === 0)) {
              badge.className = 'cal-badge minimal';
              badge.disabled = true;
              const l1 = document.createElement('span');
              l1.className = 'cal-badge-l1';
              l1.textContent = `#${ep.episode_no} | ${airFmt}`;
              badge.appendChild(l1);
              body.appendChild(badge);
              continue;
            }

            const featurePart = ep.special_feature ? ' ' + ep.special_feature : '';
            const l1 = document.createElement('span');
            l1.className = 'cal-badge-l1';
            l1.textContent = `#${ep.episode_no}${featurePart}｜PUY ${ep.puy_year}年`;
            const l2 = document.createElement('span');
            l2.className = 'cal-badge-l2';
            l2.textContent = airFmt;
            badge.appendChild(l1);
            badge.appendChild(l2);

            if (hasImage) {
              badge.className = 'cal-badge';
              badge.title = '画像を新しいタブで開く';
              badge.addEventListener('click', () => window.open(`images/setuplits/${ep.image_file}`, '_blank'));
              body.appendChild(badge);
              if (hasTracks) {
                const trackBtn = document.createElement('button');
                trackBtn.className = 'cal-track-btn';
                trackBtn.textContent = '📋 曲目一覧を見る';
                trackBtn.addEventListener('click', () => openModal(ep));
                body.appendChild(trackBtn);
              }
            } else if (hasTracks) {
              badge.className = 'cal-badge';
              badge.title = '曲目一覧を表示';
              badge.addEventListener('click', () => openModal(ep));
              body.appendChild(badge);
            } else {
              badge.className = 'cal-badge no-data';
              badge.disabled = true;
              body.appendChild(badge);
            }
          }
        }

        cell.appendChild(body);
        grid.appendChild(cell);
      }

      calArea.appendChild(grid);
    }

    // ── Tab switching ──
    const tabBtns = document.querySelectorAll('.sul-tab-btn');

    function switchTab(tab) {
      tabBtns.forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tab);
        b.setAttribute('aria-selected', b.dataset.tab === tab ? 'true' : 'false');
      });
      if (tab === 'list') {
        listArea.hidden = false;
        calArea.hidden  = true;
        listNav.hidden  = false;
      } else {
        listArea.hidden = true;
        calArea.hidden  = false;
        listNav.hidden  = true;
        renderCalendar();
      }
    }

    tabBtns.forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

    // ── Modal ──
    const modalOverlay = document.getElementById('epModalOverlay');
    const modalTitle   = document.getElementById('epModalTitle');
    const modalBody    = document.getElementById('epModalBody');
    const modalClose   = document.getElementById('epModalClose');

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderTrackTable(tracks) {
      const wrap = document.createElement('div');
      wrap.className = 'ep-track-scroll';
      const tbl = document.createElement('table');
      tbl.className = 'ep-track-table';
      tbl.innerHTML =
        '<thead><tr>' +
        '<th class="col-no">No.</th>' +
        '<th>曲名</th>' +
        '<th>アーティスト</th>' +
        '<th class="col-note">備考</th>' +
        '</tr></thead>';
      const tbody = document.createElement('tbody');
      for (const t of tracks) {
        const tr = document.createElement('tr');
        let noteCls = '';
        if (t.note === '特集枠') noteCls = 'tokushu';
        else if (t.note === '洋楽枠') noteCls = 'yougaku';
        else if (t.note) noteCls = 'other';
        const noteBadge = t.note
          ? `<span class="note-badge ${noteCls}">${escHtml(t.note)}</span>`
          : '';
        tr.innerHTML =
          `<td class="col-no">${t.no}</td>` +
          `<td>${escHtml(t.title)}</td>` +
          `<td>${escHtml(t.artist)}</td>` +
          `<td class="col-note">${noteBadge}</td>`;
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      wrap.appendChild(tbl);
      return wrap;
    }

    function openModal(ep) {
      const [y, m, d] = (ep.air_date || '').split('-').map(Number);
      const airFmt = ep.air_date ? `${y}.${m}.${d}` : '—';
      let titleText = `#${ep.episode_no} ｜ PUY ${ep.puy_year}年 ｜ ${airFmt}`;
      if (ep.special_feature) titleText += ` ｜ ${ep.special_feature}`;
      modalTitle.textContent = titleText;
      modalBody.innerHTML = '';

      if (ep.tracks && ep.tracks.length > 0) {
        modalBody.appendChild(renderTrackTable(ep.tracks));
      } else {
        const p = document.createElement('p');
        p.className = 'ep-modal-nodata';
        p.textContent = 'データ準備中';
        modalBody.appendChild(p);
      }

      modalOverlay.removeAttribute('hidden');
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    }

    function closeModal() {
      modalOverlay.setAttribute('hidden', '');
      document.body.style.overflow = '';
      modalBody.innerHTML = '';
    }

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

    // ── back to top ──
    window.addEventListener('scroll', () => {
      backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
    }, { passive: true });
    backToTop.style.display = 'none';
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  })();

  </script>
</body>
</html>
