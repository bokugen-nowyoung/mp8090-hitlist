<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up List アーカイブ | #mp8090 × ナウヤン同盟</title>
  <meta name="description" content="LuckyFM「Music Pick Up 80's & 90's」(#mp8090)の過去放送回Set Up List（オンエアリスト）アーカイブ。放送日・特集名から過去回を検索できます。">
  <meta property="og:title" content="Set Up List アーカイブ | #mp8090 × ナウヤン同盟">
  <meta property="og:description" content="mp8090の過去放送回Set Up List（オンエアリスト）アーカイブ。放送日・特集名から検索OK、随時更新中！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bokugen-nowyoung.github.io/mp8090-hitlist/setuplits.html">
  <meta property="og:site_name" content="ナウヤン同盟の部屋">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:image" content="https://bokugen-nowyoung.github.io/mp8090-hitlist/images/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Set Up List 専用スタイル ── */
    /* スクロール時、上から「金色の帯」→「ナビ帯」の2段を上部固定する。
       金色の帯: top:0、ナビ帯: 金色の帯の高さ分(約38px)だけ下にずらして直下に貼り付く。
       z-index は 金色の帯(900) > ナビ帯(800) > ↑TOP ボタン(500) > 本文 の順。
       モーダル(1000)はどちらより前面。両帯とも背景は不透明。 */
    .top-banner-strip {
      position: sticky;
      top: 0;
      z-index: 900;
    }
    /* ナビ帯（リスト/カレンダー切替・YEAR SELECT）を金色の帯の直下に固定 */
    .sul-nav {
      background: var(--bg-nav);
      border-bottom: 2px solid #3A1C00;
      padding: 0.75rem 1rem;
      position: sticky;
      top: 38px;          /* 金色の帯の高さ分ずらす（直下に貼り付く） */
      z-index: 800;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45);
    }
    /* 狭幅では金色の帯が低くなる(約35px)のでナビ帯の top も詰める */
    @media (max-width: 600px) {
      .sul-nav { top: 34px; }
    }
    .sul-nav-inner {
      max-width: 860px;
      margin: 0 auto;
    }
    .sul-nav .nav-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--accent-mg);
      letter-spacing: 0.28em;
      margin-bottom: 0.5rem;
      opacity: 0.75;
    }
    .sul-nav .year-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .sul-year-btn {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right:  2px solid #0E0400;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.28rem 0.5rem;
      min-width: 3.6rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, box-shadow 0.12s, transform 0.08s;
      user-select: none;
      text-align: center;
      text-decoration: none;
    }
    .sul-year-btn:hover {
      background: var(--bg-nav-btn-h);
      color: var(--gold-l);
      border-color: var(--gold-d);
      border-bottom-color: #0E0400;
    }
    /* PC表示のみ: 10列固定で 80年代 / 90年代 の2行に分ける */
    @media (min-width: 481px) {
      .sul-nav .year-buttons {
        display: grid;
        grid-template-columns: repeat(10, auto);
        justify-content: center;
      }
    }

    /* ── YEAR SELECT アコーディオン ──
       PC: 年ボタンは常に表示。見出しはボタン化するが矢印は隠し、
           クリックしても表示は変わらない（cursor も通常のまま）。
       スマホ(≤600px): 見出しタップで年ボタンを開閉。初期は閉じる。 */
    .sul-nav .nav-label.year-accordion-toggle {
      /* button 要素の既定見た目をリセットし、nav-label の文字スタイルは活かす */
      width: 100%;
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      cursor: default;
    }
    .year-accordion-arrow {
      display: none;                /* PCでは非表示 */
      margin-left: 0.6em;
      letter-spacing: 0;
      flex-shrink: 0;
    }
    .year-accordion-arrow::before { content: "\25BC"; }   /* ▼ 閉じている */
    #listNav:not(.year-collapsed) .year-accordion-arrow::before { content: "\25B2"; } /* ▲ 開いている */

    @media (max-width: 600px) {
      .sul-nav .nav-label.year-accordion-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;            /* タップ可能 */
      }
      .year-accordion-arrow { display: inline-block; }
      /* 閉じている間は年ボタンを隠す（id+class でグリッド/フレックス指定より優先） */
      #listNav.year-collapsed .year-buttons { display: none; }
    }

    /* ── Main content ── */
    .sul-main {
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* ── Year section ── */
    .sul-year-section {
      margin-bottom: 2.5rem;
      background: #fff;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border: 1px solid var(--border-table);
      animation: fadeIn 0.3s ease;
    }

    .sul-year-header {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .sul-year-title {
      color: #fff;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    }
    .sul-year-count {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.9);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Episode rows ── */
    .sul-list {
      list-style: none;
    }
    .sul-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1.1rem;
      border-bottom: 1px solid var(--border-table);
      transition: background 0.12s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .sul-item:last-child {
      border-bottom: none;
    }
    .sul-item:nth-child(odd)  { background: var(--stripe-odd); }
    .sul-item:nth-child(even) { background: var(--stripe-even); }

    .sul-item.has-image:hover,
    .sul-item.has-tracks:hover {
      background: #FFEEC0;
    }
    .sul-item.no-data {
      cursor: default;
      opacity: 0.62;
    }
    .sul-track-btn {
      background: var(--accent-cyan);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font-size: 0.8rem;
      padding: 0.22rem 0.5rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s;
      line-height: 1;
    }
    .sul-track-btn:hover { background: var(--accent-cyan-l); }

    .sul-ep-no {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--accent-mg);
      font-weight: 700;
      min-width: 3.8rem;
      white-space: nowrap;
    }
    .sul-date {
      font-family: var(--font-mono);
      font-size: 0.77rem;
      color: var(--text-muted);
      min-width: 6.5rem;
      white-space: nowrap;
    }
    .sul-feature {
      font-size: 0.9rem;
      color: var(--text-dark);
      flex: 1;
      min-width: 0;
    }
    .sul-badge-pending {
      display: inline-block;
      font-family: var(--font-sans);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: #E0D0B8;
      color: #9A7850;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sul-img-icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ── Loading / Error ── */
    .sul-loading {
      text-align: center;
      color: var(--text-mid);
      font-style: italic;
      padding: 4rem 1rem;
      font-size: 1.1rem;
    }
    .sul-loading .loading-icon {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
      animation: float 1.8s ease-in-out infinite;
    }
    .sul-error {
      background: #FFF0F0;
      color: #C00;
      border: 1px solid #FCC;
      border-radius: var(--r-md);
      padding: 1.2rem 1.5rem;
      text-align: center;
    }

    /* ── Back link in header ── */
    .header-back-link {
      display: inline-block;
      color: var(--accent-cyan-xl);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      text-decoration: none;
      letter-spacing: 0.06em;
      margin-bottom: 0.9rem;
      opacity: 0.85;
      transition: opacity 0.12s;
    }
    .header-back-link:hover { opacity: 1; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .sul-item {
        flex-wrap: wrap;
        gap: 0.3rem;
      }
      .sul-date {
        min-width: auto;
      }
    }
    @media (max-width: 420px) {
      .sul-ep-no { font-size: 0.78rem; min-width: 3.2rem; }
      .sul-date  { font-size: 0.7rem; }
      .sul-feature { font-size: 0.82rem; }
    }

    /* ── Episode modal ── */
    .ep-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.62);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }
    .ep-modal-overlay[hidden] { display: none; }

    .ep-modal {
      background: var(--bg-primary);
      border-radius: var(--r-lg);
      box-shadow: 0 8px 40px rgba(0,0,0,0.55);
      width: 100%;
      max-width: 620px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 3rem);
    }
    .ep-modal-hdr {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      padding: 0.9rem 3.2rem 0.9rem 1.25rem;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      flex-shrink: 0;
      position: relative;
    }
    .ep-modal-title {
      color: #fff;
      font-family: var(--font-mono);
      font-size: clamp(0.72rem, 2.5vw, 0.92rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 1.4;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
      display: block;
    }
    .ep-modal-close {
      position: absolute;
      top: 0.55rem;
      right: 0.6rem;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      border-radius: 50%;
      width: 2.4rem;
      height: 2.4rem;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      flex-shrink: 0;
    }
    .ep-modal-close:hover { background: rgba(255,255,255,0.32); }
    .ep-modal-body {
      padding: 1.1rem 1.25rem 1.25rem;
      overflow-y: auto;
      flex: 1;
    }

    /* Modal inner tabs */
    .ep-modal-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.9rem;
    }
    .ep-modal-tab {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right: 2px solid #0E0400;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      padding: 0.38rem 1rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .ep-modal-tab:hover { background: var(--bg-nav-btn-h); color: var(--gold-l); }
    .ep-modal-tab.active {
      background: var(--accent-mg);
      color: #fff;
      border-color: #7A0050;
      border-bottom-color: #3A0020;
      border-right-color: #3A0020;
    }

    /* Track table */
    .ep-track-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ep-track-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      min-width: 320px;
    }
    .ep-track-table th {
      background: var(--bg-secondary);
      color: var(--text-mid);
      font-weight: 700;
      padding: 0.42rem 0.55rem;
      text-align: left;
      border-bottom: 2px solid var(--border-head);
      white-space: nowrap;
    }
    .ep-track-table td {
      padding: 0.38rem 0.55rem;
      border-bottom: 1px solid var(--border-table);
      vertical-align: middle;
    }
    .ep-track-table tr:nth-child(odd)  td { background: var(--stripe-odd); }
    .ep-track-table tr:nth-child(even) td { background: var(--stripe-even); }
    .ep-track-table .col-no {
      width: 2rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
    }
    .ep-track-table .col-note { white-space: nowrap; }

    /* Note badges */
    .note-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 0.12rem 0.48rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .note-badge.tokushu { background: var(--accent-mg);   color: #fff; }
    .note-badge.yougaku { background: var(--accent-cyan);  color: #fff; }
    .note-badge.other   { background: #E0D0B8; color: #7A5830; }

    /* Modal image */
    .ep-modal-img {
      width: 100%;
      border-radius: var(--r-md);
      display: block;
    }

    /* No data message */
    .ep-modal-nodata {
      text-align: center;
      color: var(--text-muted);
      padding: 2.5rem 1rem;
      font-style: italic;
      font-size: 1rem;
    }

    @media (max-width: 600px) {
      .ep-modal-overlay { padding: 0.5rem; }
      .ep-modal { max-height: calc(100vh - 1rem); border-radius: var(--r-md); }
      .ep-modal-hdr { padding: 0.8rem 3rem 0.8rem 1rem; }
      .ep-modal-body { padding: 0.9rem 1rem 1rem; }
    }

    /* ── Tab bar ── */
    .sul-tab-bar {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .sul-tab-btn {
      background: var(--bg-nav-btn);
      color: #C08050;
      border: 1px solid #4A2600;
      border-bottom: 3px solid #0E0400;
      border-right: 2px solid #0E0400;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      letter-spacing: 0.03em;
      padding: 0.35rem 0.95rem;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .sul-tab-btn:hover {
      background: var(--bg-nav-btn-h);
      color: var(--gold-l);
    }
    .sul-tab-btn.active {
      background: var(--accent-mg);
      color: #fff;
      border-color: #7A0050;
      border-bottom-color: #3A0020;
      border-right-color: #3A0020;
    }

    /* ── Calendar year nav ── */
    .cal-year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin: 1.5rem 0 1rem;
    }
    .cal-year-nav-btn {
      background: var(--accent-mg);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      width: 2.4rem;
      height: 2.4rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.12s, opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cal-year-nav-btn:hover:not(:disabled) { background: #5A0040; }
    .cal-year-nav-btn:disabled { opacity: 0.35; cursor: default; }
    .cal-year-display {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent-mg);
      letter-spacing: 0.05em;
      min-width: 6rem;
      text-align: center;
    }

    /* ── Calendar grid ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }
    @media (max-width: 600px) {
      .cal-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Month cell ── */
    .cal-month {
      background: #fff;
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-table);
      overflow: hidden;
    }
    .cal-month-hdr {
      background: linear-gradient(135deg, #5A0040 0%, #9B1060 60%, #C01878 100%);
      color: #fff;
      text-align: center;
      padding: 0.4rem 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .cal-month-body {
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 3.2rem;
    }
    .cal-empty {
      color: var(--text-muted);
      text-align: center;
      font-size: 1rem;
      padding: 0.5rem 0;
      align-self: center;
    }

    /* ── Episode badge ── */
    .cal-badge {
      display: block;
      width: 100%;
      min-height: 44px;
      background: #006D77;
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      padding: 0.5rem 0.7rem;
      font-size: 0.72rem;
      font-family: var(--font-sans);
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: background 0.12s;
      word-break: break-all;
    }
    .cal-badge:hover { background: #005a63; }
    .cal-badge.no-data {
      background: #A8A090;
      color: #F0EAE0;
    }
    .cal-badge.minimal {
      background: #EDEAE4;
      color: #AEA89E;
      border: 1px dashed #C8C0B4;
      cursor: default;
      font-weight: 400;
    }
    .cal-badge.minimal:hover { background: #EDEAE4; }
    .cal-badge-l1 { display: block; font-weight: 600; }
    .cal-badge-l2 { display: block; font-size: 0.68rem; opacity: 0.88; margin-top: 0.1rem; }
    .ep-new-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 0.1em 0.45em;
      border-radius: 0.3em;
      letter-spacing: 0.03em;
      vertical-align: middle;
      margin-left: 0.3em;
      line-height: 1.4;
      box-shadow: 0 1px 4px rgba(255, 60, 0, 0.35);
    }
    .badge-new {
      display: inline-block;
      background: linear-gradient(135deg, #ff3b30, #ff9500);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.15em 0.5em;
      border-radius: 4px;
      margin-left: 0.4em;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }
    .cal-track-btn {
      display: block;
      width: 100%;
      background: rgba(0,109,119,0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--r-sm);
      padding: 0.2rem 0.5rem;
      font-size: 0.65rem;
      font-family: var(--font-sans);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.12s;
      text-align: center;
      margin-top: 0.2rem;
    }
    .cal-track-btn:hover { background: rgba(0,109,119,0.28); }

    /* ── 狐吉くんへの感謝 付箋スタンプ ── */
    .site-header { position: relative; }
    .thanks-fusen {
      display: block;
      position: absolute;
      top: 90px;
      right: 60px;
      z-index: 5;
      background: linear-gradient(145deg, #f5a04a 0%, #e8823a 100%);
      color: #fff;
      text-decoration: none;

    function openModal(ep) {
      const [y, m, d] = (ep.air_date || '').split('-').map(Number);
      const airFmt = ep.air_date ? `${y}.${m}.${d}` : '—';
      let titleText = `#${ep.episode_no} ｜ PUY ${ep.puy_year}年 ｜ ${airFmt}`;
      if (ep.special_feature) titleText += ` ｜ ${ep.special_feature}`;
      modalTitle.textContent = titleText;
      modalBody.innerHTML = '';

      if (ep.tracks && ep.tracks.length > 0) {
        modalBody.appendChild(renderTrackTable(ep.tracks));
      } else {
        const p = document.createElement('p');
        p.className = 'ep-modal-nodata';
        p.textContent = 'データ準備中';
        modalBody.appendChild(p);
      }

      modalOverlay.removeAttribute('hidden');
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    }

    function closeModal() {
      modalOverlay.setAttribute('hidden', '');
      document.body.style.overflow = '';
      modalBody.innerHTML = '';
    }

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeModal(); });

    // ── back to top ──
    window.addEventListener('scroll', () => {
      backToTop.style.display = window.scrollY > 300 ? 'block' : 'none';
    }, { passive: true });
    backToTop.style.display = 'none';
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ===== URLパラメータ ?ep=NNN で該当回モーダルを自動オープン =====
    try {
      var epParam = new URLSearchParams(location.search).get('ep');
      if (epParam) {
        var epNo = Number(epParam);
        if (epNo) {
          var t = episodes.find(function(e){ return e.episode_no === epNo; });
          if (t) { openModal(t); }
        }
      }
    } catch (err) { /* 何もしない */ }

  })();
</script>
</body>
</html>
